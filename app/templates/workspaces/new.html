{% extends "base.html" %}{% load ots_ui %}
{% block content %}
<div class="flex flex-col gap-4 max-w-page">
  {% include "files/_nav.html" %}
  <section class="bg-canvas border border-line rounded-md shadow-card p-5 flex flex-col gap-3" aria-label="New File ID">
    <h3 class="text-sec font-semibold">New File ID</h3>
    {% if error %}<p class="text-body text-danger" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/files/ids/new" x-data="fileIdForm" class="grid grid-cols-1 md:grid-cols-2 gap-3">{% csrf_token %}
      <label class="flex flex-col gap-1 text-cap text-ink-600">Name<input name="name" required maxlength="200" value="{{ form.name }}" x-ref="name" @input="nameTyped" class="h-5 px-3 rounded-sm border border-line bg-canvas text-body text-ink-900"></label>
      <label class="flex flex-col gap-1 text-cap text-ink-600">File ID
        <input name="file_id" maxlength="40" value="{{ form.file_id }}" x-ref="fid" @input="typedId" autocomplete="off" placeholder="Made from the name, for example FTS-AZE-483921" class="h-5 px-3 rounded-sm border border-line bg-canvas text-body text-ink-900 font-semibold tracking-wide">
        <span class="text-cap" :class="stateClass" x-text="note" role="status" aria-live="polite"></span></label>
      <label class="flex flex-col gap-1 text-cap text-ink-600">Category<select name="category" class="h-5 px-3 rounded-sm border border-line bg-canvas text-body text-ink-900">{% for v, l in categories %}<option value="{{ v }}">{{ l }}</option>{% endfor %}</select></label>
      <label class="flex flex-col gap-1 text-cap text-ink-600">Tags (comma separated)<input name="tags" value="{{ form.tags }}" class="h-5 px-3 rounded-sm border border-line bg-canvas text-body text-ink-900"></label>
      <label class="flex flex-col gap-1 text-cap text-ink-600 md:col-span-2">Description<textarea name="description" rows="2" maxlength="2000" class="px-3 py-2 rounded-sm border border-line bg-canvas text-body text-ink-900">{{ form.description }}</textarea></label>
      <div class="md:col-span-2">{% include "components/button.html" with label="Create File ID" type="submit" %}</div>
    </form>
  </section>
</div>
{% endblock %}
