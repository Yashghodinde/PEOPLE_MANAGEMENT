{% load static %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ office }}</title>
<style>
:root{--canvas:#FFFFFF;--ink:#111111;--soft:#555555;--line:#E8E8E8;--accent:#2F3E56;--ok:#2E7D4F;--bad:#B23A3A;--s:1;--cols:4;--rows:8}
*{box-sizing:border-box;margin:0}
html,body{width:100%;height:100%;background:var(--canvas);color:var(--ink);font:calc(26px*var(--s))/1.3 Inter,system-ui,sans-serif;overflow:hidden}
#board{position:fixed;inset:0;padding:calc(18px*var(--s)) calc(34px*var(--s)) calc(16px*var(--s));display:flex;flex-direction:column;gap:calc(13px*var(--s));animation:fade 233ms ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.top{display:flex;align-items:center;justify-content:space-between;gap:calc(34px*var(--s));border-bottom:calc(2px*var(--s)) solid var(--line);padding-bottom:calc(8px*var(--s))}
.office{font-size:calc(42px*var(--s));font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.counts{display:flex;gap:calc(42px*var(--s));color:var(--soft);white-space:nowrap}
.counts b{color:var(--ink);font-size:calc(42px*var(--s));font-weight:600;margin-right:calc(8px*var(--s))}
.counts .bad b,.bad{color:var(--bad)}
.when{text-align:right;line-height:1.1;white-space:nowrap}.clock{font-size:calc(55px*var(--s));font-weight:600;line-height:1}.date{color:var(--soft)}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));grid-template-rows:repeat(var(--rows),minmax(0,1fr));gap:calc(10px*var(--s))}
.card{border:calc(2px*var(--s)) solid var(--line);border-radius:calc(13px*var(--s));padding:calc(4px*var(--s)) calc(18px*var(--s));overflow:hidden;display:flex;flex-direction:column;justify-content:center;line-height:1.15}
.card.overdue{border-color:var(--bad)}
.card h2{font-size:calc(28px*var(--s));font-weight:600;display:flex;justify-content:space-between;gap:calc(13px*var(--s));white-space:nowrap}
.card .name{flex-shrink:0;max-width:70%;overflow:hidden;text-overflow:ellipsis}.card .st{flex:1 1 0;min-width:0;text-align:right;overflow:hidden;text-overflow:ellipsis;font-size:calc(26px*var(--s));font-weight:400;color:var(--soft)}
.task{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{color:var(--soft);font-size:calc(26px*var(--s));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{grid-column:1/-1;grid-row:1/-1;align-self:center;text-align:center;color:var(--soft);font-size:calc(42px*var(--s))}
.more{color:var(--soft);text-align:right;min-height:0}.more:empty{display:none}
.strip{display:flex;gap:calc(34px*var(--s));align-items:center;border-top:calc(2px*var(--s)) solid var(--line);padding-top:calc(8px*var(--s));white-space:nowrap;overflow:hidden;color:var(--ok)}
.strip .label{color:var(--ink);font-weight:600}.strip .none{color:var(--soft)}
</style>
</head>
<body>
<div id="board">{% include "display/_board.html" %}</div>
<script src="{% static 'js/display-core.js' %}"></script>
<script src="{% static 'js/display.js' %}"></script>
</body>
</html>
