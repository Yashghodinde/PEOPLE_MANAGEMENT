{% load ots_ui %}<div x-data="voiceRecorder" data-task-id="{{ task.pk }}" data-max-seconds="{{ voice_max_seconds }}" class="border border-line rounded-sm p-3 flex flex-col gap-2" aria-label="Voice message">
  <div class="flex items-center gap-2 flex-wrap">
    <span class="text-cap font-medium text-ink-900">Voice message</span>
    <span class="text-cap text-ink-600">up to {{ voice_max_seconds }} seconds</span>
  </div>
  <div class="flex items-center gap-2 flex-wrap" x-show="isReady">
    <button type="button" @click="start" class="inline-flex items-center gap-2 h-5 px-4 rounded-full border border-accent text-accent bg-canvas hover:bg-line text-body font-medium">{% icon "mic" %} Record</button>
  </div>
  <div class="flex items-center gap-3 flex-wrap" x-show="isRecording" x-cloak role="status">
    <span class="ots-dot ots-dot-chat motion-pulse" aria-hidden="true"></span><span class="text-body tabular-nums" x-text="timerText">0:00</span>
    <button type="button" @click="stop" class="h-5 px-4 rounded-full bg-accent text-canvas text-body font-medium">Stop</button>
  </div>
  <div class="flex flex-col gap-2" x-show="isPreview" x-cloak>
    <audio controls :src="previewUrl" class="w-full max-w-[420px]" aria-label="Listen before sending"></audio>
    <div class="flex items-center gap-2 flex-wrap">
      <button type="button" @click="send" class="h-5 px-4 rounded-full bg-accent text-canvas text-body font-medium">Send voice message</button>
      <button type="button" @click="discard" class="h-5 px-4 rounded-full border border-line text-ink-600 hover:bg-line text-body">Discard</button>
    </div>
  </div>
  <div class="flex items-center gap-2" x-show="isUploading" x-cloak role="status"><span class="text-body text-ink-600">Sending the recording...</span></div>
  <div class="flex items-center gap-2 flex-wrap" x-show="isFailed" x-cloak>
    <button type="button" @click="retry" class="h-5 px-4 rounded-full bg-accent text-canvas text-body font-medium">Try again</button>
    <button type="button" @click="discard" class="h-5 px-4 rounded-full border border-line text-ink-600 hover:bg-line text-body">Discard</button>
  </div>
  <p class="text-cap" :class="noteClass" x-text="note" role="status" aria-live="polite"></p>
</div>
