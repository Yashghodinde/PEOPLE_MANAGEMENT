{% load ots_ui %}<div x-data="voicePlayer" data-src="/files/v/{{ c.voice_version_id }}/preview" data-seconds="{{ c.voice_seconds|default:0 }}" class="flex items-center gap-3 flex-wrap" role="group" aria-label="Voice message from {{ c.author.full_name }}">
  <button type="button" @click="toggle" class="inline-flex items-center justify-center w-5 h-5 rounded-full bg-accent text-canvas shrink-0" :aria-label="buttonLabel" aria-label="Play voice message">{% icon "mic" %}</button>
  <div class="flex flex-col gap-1 grow min-w-[140px] max-w-[320px]">
    <div class="h-2 rounded-full bg-line cursor-pointer overflow-hidden" role="progressbar" aria-label="Position" @click="seek"><div class="h-2 bg-accent" :style="barStyle" style="width:0"></div></div>
    <span class="text-cap text-ink-600 tabular-nums" x-text="label">0:00 / {{ c.voice_seconds|default:0 }}s</span>
  </div>
  <audio x-ref="audio" preload="none" @play="onPlay" @pause="onPause" @ended="onEnd" @timeupdate="onTime" @error="onError"></audio>
  <a x-show="failed" x-cloak class="text-cap text-accent" href="/files/v/{{ c.voice_version_id }}/download">Cannot play here. Download it.</a>
</div>
