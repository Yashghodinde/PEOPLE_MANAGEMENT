{% comment %}breadcrumb.html: params crumbs, a list of (label, url); the last one has an empty url and is the current page.{% endcomment %}
<nav aria-label="Breadcrumb" class="text-cap text-ink-600">
  <ol class="flex items-center gap-2 flex-wrap">
    {% for label, url in crumbs %}<li class="flex items-center gap-2">{% if url %}<a class="text-accent hover:text-ink-900" href="{{ url }}">{{ label }}</a><span aria-hidden="true">/</span>{% else %}<span aria-current="page" class="text-ink-900">{{ label }}</span>{% endif %}</li>{% endfor %}
  </ol>
</nav>
