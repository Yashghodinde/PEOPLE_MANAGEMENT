# OTS database access rules (M04.3). First match wins.
# Local socket: the container's own tools (init, health check, wal archive).
local   all             all                                     trust
# The backup role may only take base backups (it has REPLICATION and nothing else), and only from the compose network.
host    replication     ots_backup      172.16.0.0/12           scram-sha-256
host    replication     ots_backup      10.0.0.0/8              scram-sha-256
host    replication     ots_backup      192.168.0.0/16          scram-sha-256
# Everyone else: ordinary connections from the compose network, password required.
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             all                     scram-sha-256
