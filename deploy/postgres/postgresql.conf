listen_addresses = '*'
max_connections = 20
shared_buffers = 128MB
work_mem = 4MB
maintenance_work_mem = 64MB
effective_cache_size = 1GB
wal_compression = zstd
wal_level = replica
archive_mode = on
archive_timeout = 300
archive_command = '/usr/local/bin/ots-wal-archive.sh %p %f'
max_wal_size = 1GB
min_wal_size = 80MB
